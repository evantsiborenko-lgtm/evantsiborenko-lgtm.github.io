name: Build Timeweb deployment package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-timeweb-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build deployment ZIP
        shell: bash
        run: |
          rm -rf deploy kvsvideo-timeweb.zip
          mkdir -p deploy
          rsync -a ./ deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='kvsvideo-timeweb.zip' \
            --exclude='README.txt' \
            --exclude='README_RU.txt' \
            --exclude='SEO_NOTES_RU.txt' \
            --exclude='SEO_SITEMAP_GSC_NOTES_RU.txt' \
            --exclude='UPDATE_NOTES_RU.txt' \
            --exclude='assets/logo/README_logo_assets.txt' \
            --exclude='assets/marketplace/README.txt'
          cd deploy
          zip -r ../kvsvideo-timeweb.zip .
          cd ..

      - name: Commit deployment ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f kvsvideo-timeweb.zip
          git commit -m 'Add Timeweb deployment ZIP' || exit 0
          git push
