name: Build Timeweb deployment package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-timeweb-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment ZIP
        shell: bash
        run: |
          mkdir -p deploy
          rsync -a ./ deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README.txt' \
            --exclude='README_RU.txt' \
            --exclude='SEO_NOTES_RU.txt' \
            --exclude='SEO_SITEMAP_GSC_NOTES_RU.txt' \
            --exclude='UPDATE_NOTES_RU.txt' \
            --exclude='assets/logo/README_logo_assets.txt' \
            --exclude='assets/marketplace/README.txt'
          cd deploy
          zip -r ../kvsvideo-timeweb.zip .
          cd ..

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kvsvideo-timeweb
          path: kvsvideo-timeweb.zip
          if-no-files-found: error
          retention-days: 7
